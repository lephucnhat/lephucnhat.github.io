  <path d="M60 78 C60 60, 82 50, 88 62 C84 74, 68 78, 60 78 Z" fill="#6EE7B7"/>
  <path d="M60 80 L60 48" stroke="#FFFBEB" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 84 Q44 76 60 86 Q76 76 92 84 L92 92 Q76 84 60 94 Q44 84 28 92 Z" fill="#FFFBEB"/>
</svg>
