<!-- Kích thước chuẩn thay logo thật: 240x240px (SVG hoặc PNG nền trong suốt) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logo Trường Mầm non Lê Thế Hiếu">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7350"/>
      <stop offset="100%" stop-color="#289668"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="#FFFBEB" stroke-width="4"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Mặt trời ấm áp -->
