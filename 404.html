<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Không tìm thấy trang | Lê Phúc Nhật • lephucnhat.vn</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(245,158,11,0.18), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(16,185,129,0.2), transparent 45%),
                  #070b14;
      color: #f8fafc;
      text-align: center;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 36px 28px;
      border-radius: 26px;
      background: rgba(16, 24, 42, 0.9);
      border: 1px solid rgba(252, 211, 77, 0.4);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fcd34d, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.35rem; margin-bottom: 10px; color: #fef3c7; }
    p { font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 24px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 22px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    a:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: #090d16; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: #f8fafc; border: 1px solid rgba(255,255,255,0.16); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Đường dẫn này đã thay đổi hoặc không tồn tại</h1>
    <p>Mời quý bạn hữu quay trở về ngôi nhà chung <strong>lephucnhat.vn</strong> để khám phá Hệ sinh thái 34 Chuyên trang 4D, HTX Lâm Nghiệp Keo Sơn và Góc Chiêm Nghiệm Tỉnh Thức.</p>
    <div class="actions">
      <a href="/" class="btn-primary">🏠 Về Trang Chủ lephucnhat.vn</a>
      <a href="/#myWebsitesSection" class="btn-secondary">🌐 Xem 34 Chuyên Trang</a>
    </div>
  </main>
</body>
</html>
